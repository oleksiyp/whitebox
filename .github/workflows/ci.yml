name: ci
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # The Node reference: the functional suite plus the reference sanity tests.
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  # POSIX sh + awk port on the runners' own shells: dash + mawk/gawk (Ubuntu), bash 3.2 in sh mode + BSD awk (macOS).
  sh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: shellcheck -s sh skills/whitebox/scripts/*.sh
      - name: functional suite against the sh port
        run: WHITEBOX_IMPL=sh npm test
      - name: parity with the Node reference
        run: WHITEBOX_PARITY=sh WHITEBOX_PARITY_SEEDS=8 node --test test/parity.test.mjs

  # The same port inside Debian (dash + mawk) and Alpine (busybox sh + awk).
  sh-containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: debian, shell: dash }
          - { image: alpine, shell: busybox sh }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker build -f test/docker/${{ matrix.image }}.Dockerfile -t wb-${{ matrix.image }} test/docker
      - name: functional suite and parity inside the container
        env:
          WHITEBOX_PREFIX: sh ${{ github.workspace }}/test/docker/run.sh wb-${{ matrix.image }}
          WHITEBOX_SH: ${{ matrix.shell }}
        run: |
          WHITEBOX_IMPL=sh npm test
          WHITEBOX_PARITY=sh WHITEBOX_PARITY_SEEDS=6 node --test test/parity.test.mjs

  # PowerShell port on real Windows: Windows PowerShell 5.1 ("powershell") and PowerShell 7 ("pwsh").
  powershell:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        pwsh: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ${{ matrix.pwsh }} -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: functional suite against the PowerShell port
        shell: bash
        run: WHITEBOX_IMPL=ps WHITEBOX_PWSH=${{ matrix.pwsh }} npm test
      - name: parity with the Node reference
        shell: bash
        run: WHITEBOX_PARITY=ps WHITEBOX_PWSH=${{ matrix.pwsh }} WHITEBOX_PARITY_SEEDS=6 node --test test/parity.test.mjs

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: plugin and marketplace manifests are valid JSON
        run: |
          jq -e '.name and .version and .description' .claude-plugin/plugin.json
          jq -e '.name and .owner and (.plugins | length > 0)' .claude-plugin/marketplace.json
      - name: SKILL.md has name and description front matter
        run: |
          head -5 skills/whitebox/SKILL.md | grep -q '^name: whitebox$'
          head -5 skills/whitebox/SKILL.md | grep -q '^description: '
      - name: Node scripts parse
        run: for f in skills/whitebox/scripts/*.mjs; do node --check "$f"; done
