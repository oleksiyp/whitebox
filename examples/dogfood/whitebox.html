.test\\.[a-z]+|\\.spec\\.[a-z]+|(^|\\/)(tests?|__tests__|e2e)\\/|(^|\\/)test_[^/]*\\.py|_test\\.py|Test\\.java|Tests?\\.cs)$/;\nconst SECRET_RE = /(^|\\/)(\\.env[^/]*|[^/]*\\.(pem|key|p12|pfx|jks|keystore|kdbx|crt|cer|asc)|id_(rsa|dsa|ecdsa|ed25519)[^/]*|[^/]*(secret|credential|password|passwd|token)s?[^/]*\\.(json|ya?ml|toml|ini|txt|env|conf|cfg)|\\.?netrc|\\.npmrc|\\.pypirc|[^/]*\\.tfstate(\\.backup)?|[^/]*\\.tfvars)$/i;\nconst GEN_RE = /(Code generated|DO NOT EDIT|@generated|autogenerated|auto-generated|\u003cauto-generated|GENERATED FILE)/i;\nconst globRe = g => new RegExp(\"^\" + g.trim().replace(/[.+^${}()|[\\]\\\\]/g, \"\\\\$&\").replace(/\\*\\*/g, \"\\u0001\").replace(/\\*/g, \"[^/]*\").replace(/\\u0001/g, \".*\").replace(/\\?/g, \"[^/]\") + \"$\");"},{"title":"Filter Excluded Files","file":"skills/whitebox/scripts/whitebox.mjs","start":136,"end":153,"kind":"code","lang":"js","description":"Excludes lockfiles, minified and source-map files, unknown or binary types, oversized sources, secrets and generated code, and counts each reason for the report.","id":"n146","text":"      if (LOCKS.has(name.toLowerCase())) { skip(rel, \"lockfile\"); continue; }\n      if (/\\.min\\.|\\.map$/.test(name)) { skip(rel, \"minified / sourcemap\"); continue; }\n      const kind = ext === \"md\" || ext === \"markdown\" ? \"doc\" : CODE_EXT[ext] ? \"code\" : CFG_EXT.has(ext) ? \"config\" : null;\n      if (!kind) { skip(rel, \"other file type (binary, media, text data)\"); continue; }\n      if (kind === \"config\" && !withCfg) { skip(rel, \"config file (add --config to include)\"); continue; }\n      if (kind === \"code\" && !withTests && TEST_RE.test(rel)) { skip(rel, \"test file (add --tests to include)\"); continue; }\n      if (kind !== \"doc\" && fs.statSync(abs).size > maxKb * 1024) { skip(rel, `source file larger than ${maxKb} KB (add --max-kb or --include)`); continue; }\n      if (kind === \"doc\" && fs.statSync(abs).size > 8 * 1024 * 1024) { skip(rel, \"markdown larger than 8 MB\"); continue; }\n    }\n    const buf = fs.readFileSync(abs); if (buf.subarray(0, 4096).includes(0)) { skip(rel, \"binary\"); continue; }\n    if (!forced && GEN_RE.test(buf.subarray(0, 600).toString(\"utf8\").split(\"\\n\").slice(0, 6).join(\"\\n\"))) { skip(rel, \"generated code header\"); continue; }\n    included.push(abs);\n  }\n  return { files: included, mode, reasons, samples, total: rels.length };\n}\n\n/* ---------------- code segmenter (top-level declarations) ---------------- */\nconst DECL = /^(func|type|class|def|fn|pub|impl|struct|enum|trait|interface|const|var|let|export|import|package|module|use|async|public|private|protected|static|abstract|final|namespace|template|extern|mod|object|data|sealed|open)\\b/;"}],"description":"Defining which files are selected for the tree and filtering out excluded files.","id":"n144"},{"title":"Segment Source Code","children":[{"title":"Track Brace Depth","file":"skills/whitebox/scripts/whitebox.mjs","start":154,"end":173,"kind":"code","lang":"js","description":"Scans source lines while tracking bracket and parenthesis depth, ignoring comments and string contents, so that top-level declarations can be identified.","id":"n148","text":"const LEAD = /^(\\/\\/|\\/\\*|#(?!include|define|if|endif|pragma|!)|--|@[A-Za-z_(])/;\nfunction codeUnits(L, lang) {\n  const n = L.length, units = []; let depth = 0, inBlock = false, cur = null, chain = false, lastNb = 0, blankSince = false;\n  const py = lang === \"py\" || lang === \"sh\" || lang === \"ruby\";\n  const bal = l => {\n    let s = l;\n    if (inBlock) { const k = s.indexOf(\"*/\"); if (k \u003c 0) return 0; s = s.slice(k + 2); inBlock = false; }\n    if (!py) { s = s.replace(/\\/\\*.*?\\*\\//g, \"\"); const k = s.indexOf(\"/*\"); if (k >= 0) { inBlock = true; s = s.slice(0, k); } }\n    s = s.replace(/\"(\\\\.|[^\"\\\\])*\"|'(\\\\.|[^'\\\\])*'|`[^`]*`/g, \"\");\n    s = s.replace(py ? /#.*$/ : /\\/\\/.*$/, \"\");\n    let d = 0; for (const c of s) { if (\"{([\".includes(c)) d++; else if (\"})]\".includes(c)) d--; } return d;\n  };\n  for (let i = 0; i \u003c n; i++) {\n    const l = L[i];\n    if (!l.trim()) { blankSince = true; continue; }\n    const col0 = !/^\\s/.test(l);\n    if (col0 && !inBlock) {\n      if (DECL.test(l)) depth = 0;\n      const lead = LEAD.test(l);\n      const closer = /^[})\\]]/.test(l) || (lang === \"py\" && /^(else|elif|except|finally)\\b/.test(l));"},{"title":"Close Top Level Units","file":"skills/whitebox/scripts/whitebox.mjs","start":174,"end":184,"kind":"code","lang":"js","description":"Closes a code unit when depth returns to zero on a line that is not a closing bracket or chained continuation, keeping leading comments with the declaration that follows.","id":"n149","text":"      if (depth \u003c= 0 && !closer && !(chain && !blankSince)) { if (cur) units.push(cur); cur = { s: i + 1, e: i + 1 }; }\n      chain = lead;\n    } else if (!col0) chain = false;\n    depth += bal(l); if (depth \u003c 0) depth = 0;\n    if (!cur) cur = { s: i + 1, e: i + 1 };\n    cur.e = i + 1; blankSince = false;\n  }\n  if (cur) units.push(cur);\n  return units;\n}\nfunction codeSnippet(L, s, e) { return L.slice(s - 1, e).filter(x => x.trim()).slice(0, 10).map(x => x.trim().slice(0, 100)).join(\" ⏎ \"); }"}],"description":"Splitting source code into top-level units by tracking brace depth.","id":"n147"}],"description":"Reading markdown and source files, selecting files and turning them into bounded pieces.","id":"n129"},{"title":"Split And Windows","children":[{"title":"Build Pieces And Groups","children":[{"title":"Segment Selected Files","file":"skills/whitebox/scripts/whitebox.mjs","start":186,"end":204,"kind":"code","lang":"js","description":"Builds the list of pieces for each selected file by splitting its markdown sections or code units, giving each piece its file, line range and kind.","id":"n152","text":"/* ---------------- split ---------------- */\nfunction cmdSplit() {\n  if (!pos.length) die(\"usage: split \u003cdir|file...> --work W [--tests] [--config] [--max-kb 300] [--include globs] [--exclude globs]\");\n  let files, ROOT, report = null;\n  if (pos.length === 1 && fs.statSync(pos[0]).isDirectory()) {\n    ROOT = path.resolve(pos[0]); report = collectProject(ROOT); files = report.files;\n  } else { files = pos.map(f => path.resolve(f)); ROOT = path.dirname(files[0]); while (!files.every(f => f.startsWith(ROOT + path.sep))) ROOT = path.dirname(ROOT); }\n  files.sort((a, b) => path.relative(ROOT, a).toLowerCase().localeCompare(path.relative(ROOT, b).toLowerCase()));\n  const pieces = [], fl = [];\n  files.forEach((abs, fi) => {\n    const rel = path.relative(ROOT, abs), raw = fs.readFileSync(abs, \"utf8\"), L = raw.replace(/\\r\\n/g, \"\\n\").split(\"\\n\");\n    if (L.at(-1) === \"\") L.pop();\n    const ext = (rel.split(\".\").pop() || \"\").toLowerCase(), lang = CODE_EXT[ext], first = pieces.length + 1;\n    if (lang) {\n      for (const u of pack(L, codeUnits(L, lang), 200, 40, true)) pieces.push({ i: pieces.length + 1, f: fi, s: u.s, e: u.e, w: u.w, hp: \"\", k: \"c\", lang, sn: codeSnippet(L, u.s, u.e) });\n    } else for (const p of piecesOf(L)) pieces.push({ i: pieces.length + 1, f: fi, s: p.s, e: p.e, w: p.w, hp: p.hp, sn: snip(txt(L, p.s, p.e), 18) });\n    fl.push({ rel, bytes: Buffer.byteLength(raw), first, last: pieces.length, lang: lang || \"md\" });\n  });\n  if (report) {"},{"title":"Form Balanced Groups","file":"skills/whitebox/scripts/whitebox.mjs","start":205,"end":218,"kind":"code","lang":"js","description":"Groups files into contiguous families and sorts them into roughly equal groups by byte count, keeping numbered variants of one file together.","id":"n153","text":"    const by = {}; fl.forEach(f => by[f.lang] = (by[f.lang] || 0) + 1);\n    console.log(`selection (${report.mode === \"git\" ? \"git: tracked + untracked, honouring .gitignore\" : \"directory walk\"}): ${files.length} of ${report.total} files included`);\n    console.log(\"  included: \" + Object.entries(by).map(([k, v]) => `${v} ${k}`).join(\", \"));\n    for (const [why, n] of Object.entries(report.reasons).sort((a, b) => b[1] - a[1])) console.log(`  skipped ${String(n).padStart(4)}  ${why}   e.g. ${report.samples[why].join(\", \")}`);\n    fs.mkdirSync(WORK, { recursive: true }); fs.writeFileSync(wp(\"selection.json\"), JSON.stringify({ included: fl.map(f => f.rel), reasons: report.reasons, samples: report.samples }, null, 1));\n  }\n  // families (name-2, name-3 stay together), contiguous balanced groups by bytes\n  const fam = []; fl.forEach(f => { const k = f.rel.replace(/-\\d+(\\.(md|markdown))$/i, \"$1\"); const last = fam.at(-1); if (last && last.k === k) last.files.push(f); else fam.push({ k, files: [f] }); });\n  fam.forEach(x => x.bytes = x.files.reduce((a, f) => a + f.bytes, 0));\n  const total = fam.reduce((a, f) => a + f.bytes, 0), M = Math.max(1, Math.min(fam.length, Math.floor(Math.sqrt(files.length))));\n  const groups = []; let cur = [], cum = 0;\n  fam.forEach((x, idx) => {\n    cur.push(x); cum += x.bytes;\n    const left = fam.length - idx - 1, need = M - groups.length - 1; // families left vs groups still to open"},{"title":"Cut Windows Within Groups","file":"skills/whitebox/scripts/whitebox.mjs","start":219,"end":235,"kind":"code","lang":"js","description":"Cuts each group into consecutive windows of about the configured piece count, preferring file boundaries near the target so each window is a reasonable size.","id":"n154","text":"    if (groups.length \u003c M - 1 && (cum >= total * (groups.length + 1) / M || left \u003c= need)) { groups.push(cur); cur = []; }\n  });\n  if (cur.length) groups.push(cur);\n  const G = groups.map((g, gi) => {\n    const fs_ = g.flatMap(x => x.files), from = fs_[0].first, to = fs_.at(-1).last;\n    const windows = []; let ws = from;\n    while (ws \u003c= to) {\n      let we = Math.min(to, ws + WIN - 1);\n      if (we \u003c to) { // prefer cutting at a file boundary within [ws+WIN*0.7, ws+WIN*1.3]\n        let best = null; for (const f of fs_) if (f.last >= ws + WIN * 0.7 && f.last \u003c= Math.min(to, ws + WIN * 1.3)) { if (best === null || Math.abs(f.last - (ws + WIN - 1)) \u003c Math.abs(best - (ws + WIN - 1))) best = f.last; }\n        if (best !== null) we = best;\n      }\n      windows.push({ w: windows.length + 1, from: ws, to: we }); ws = we + 1;\n    }\n    return { g: gi + 1, files: fs_.map(f => f.rel), bytes: g.reduce((a, x) => a + x.bytes, 0), from, to, windows };\n  });\n  fs.mkdirSync(wp(\"out\"), { recursive: true }); fs.mkdirSync(wp(\"desc\"), { recursive: true });"}],"description":"Segmenting selected files, forming balanced groups and cutting windows within each group.","id":"n151"},{"title":"Report Split Results","children":[{"title":"Write Split Artifacts","file":"skills/whitebox/scripts/whitebox.mjs","start":236,"end":257,"kind":"code","lang":"js","description":"Writes the pieces, groups and cost estimate files to the work directory and prints the file count, piece count, group sizes and estimated token cost.","id":"n156","text":"  fs.writeFileSync(wp(\"pieces.json\"), JSON.stringify({ root: ROOT, files: fl, pieces }));\n  fs.writeFileSync(wp(\"groups.json\"), JSON.stringify(G, null, 1));\n  console.log(`${files.length} files, ${pieces.length} pieces -> ${G.length} groups`);\n  const est = estimateOf(pieces, G); fs.writeFileSync(wp(\"estimate.json\"), JSON.stringify(est)); printEstimate(est);\n  G.forEach(g => console.log(`  group ${g.g}: ${g.files.length} files, ${(g.bytes / 1024) | 0} KB, ${g.to - g.from + 1} pieces, ${g.windows.length} windows`));\n}\n\n/* ---------------- cost estimate ---------------- */\n// Calibrated on two real runs: ~0.7k haiku tokens per prose piece, ~1.5k per code piece (+ reshape ~25%).\nfunction estimateOf(pieces, G) {\n  const code = pieces.filter(p => p.k === \"c\").length, doc = pieces.length - code;\n  const tokensM = (doc * 0.7 + code * 1.5) * 1.25 / 1000;\n  const windows = G.reduce((a, g) => a + g.windows.length, 0);\n  const agents = windows + G.length + Math.round(pieces.length / 60) + 6;\n  const longest = Math.max(...G.map(g => g.windows.length));\n  const minutes = Math.round(longest * 3.2 + 6 + Math.min(10, pieces.length / 1500));\n  return { pieces: pieces.length, docPieces: doc, codePieces: code, windows, groups: G.length, agents, tokensM: +tokensM.toFixed(1), minutes };\n}\nfunction printEstimate(e) {\n  console.log(`estimate: ~${e.agents} haiku agents, ~${e.tokensM}M tokens, ~${e.minutes} min wall-clock (${e.docPieces} doc + ${e.codePieces} code pieces, ${e.windows} windows). Rough: real runs landed within 0.5x-2.5x.`);\n}\nfunction cmdEstimate() { printEstimate(readJ(wp(\"estimate.json\"))); }"},{"title":"Emit Group Metadata","file":"skills/whitebox/scripts/whitebox.mjs","start":534,"end":536,"kind":"code","lang":"js","description":"Prints the work directory, the command path and the list of groups as JSON so that other steps can address each group and window.","id":"n157","text":"function cmdGroupsArgs() {\n  console.log(JSON.stringify({ work: path.relative(process.cwd(), WORK) || \".\", cli: SELF, groups: GR().map(g => ({ g: g.g, windows: g.windows.length })) }));\n}"}],"description":"Writing split artifacts and emitting group metadata after a split.","id":"n155"},{"title":"Read Window Outputs","children":[{"title":"Load Window Rows","file":"skills/whitebox/scripts/whitebox.mjs","start":259,"end":268,"kind":"code","lang":"js","description":"Reads a window output file and parses each row into an id and a path, returning nothing when the window has no output yet.","id":"n159","text":"/* ---------------- shared readers ---------------- */\nconst P = () => (P.c ??= readJ(wp(\"pieces.json\")));\nconst GR = () => (GR.c ??= readJ(wp(\"groups.json\")));\nconst outFile = (g, w) => wp(\"out\", `g${g}-w${w}.txt`);\nconst sumFile = (g, w) => wp(\"out\", `g${g}-w${w}.sum`);\nfunction readOut(g, w) {\n  const f = outFile(g, w); if (!fs.existsSync(f)) return null;\n  return fs.readFileSync(f, \"utf8\").split(\"\\n\").map(l => l.trim()).filter(Boolean).map(l => { const k = l.indexOf(\";\"), rest = l.slice(k + 1), k2 = rest.indexOf(\";\"); return { id: +l.slice(0, k), path: (k2 \u003c 0 ? rest : rest.slice(0, k2)).trim(), desc: k2 \u003c 0 ? \"\" : rest.slice(k2 + 1).trim() }; });\n}\nconst segsOk = s => { const w = s.trim().split(/\\s+/).filter(Boolean); return w.length >= 2 && w.length \u003c= 4 && !/[;]/.test(s); };"}],"description":"Loading the rows produced by each window.","id":"n158"},{"title":"Print Window Task","children":[{"title":"Collect Existing Branch Vocabulary","file":"skills/whitebox/scripts/whitebox.mjs","start":270,"end":281,"kind":"code","lang":"js","description":"Collects the branch paths already created by earlier windows of the group, with their piece counts, so that later windows reuse the same branch names.","id":"n161","text":"/* ---------------- window ---------------- */\nfunction cmdWindow() {\n  const g = +pos[0], w = +pos[1], G = GR().find(x => x.g === g); if (!G) die(\"no such group\");\n  const win = G.windows.find(x => x.w === w); if (!win) die(\"no such window\");\n  const prevSum = w > 1 && fs.existsSync(sumFile(g, w - 1)) ? fs.readFileSync(sumFile(g, w - 1), \"utf8\").trim() : \"\";\n  const vocab = new Map();\n  for (let k = 1; k \u003c w; k++) for (const r of readOut(g, k) || []) { const s = r.path.split(\"/\"); s.pop(); for (let d = 1; d \u003c= Math.min(3, s.length); d++) { const p = s.slice(0, d).join(\"/\"); vocab.set(p, (vocab.get(p) || 0) + 1); } }\n  let vl = [...vocab].sort((a, b) => a[0].localeCompare(b[0])); if (vl.length > 160) vl = vl.filter(([p]) => p.split(\"/\").length \u003c= 2);\n  const out = `${path.relative(process.cwd(), outFile(g, w))}`, sum = `${path.relative(process.cwd(), sumFile(g, w))}`;\n  let hasCode = false; for (let i = win.from; i \u003c= win.to; i++) if (P().pieces[i - 1].k === \"c\") { hasCode = true; break; }\n  const codeRules = hasCode ? `\nCODE PIECES (marked [code \u003clang>]) - INVERT THE CODE INTO SPECIFICATION"},{"title":"Compose Code Rules Text","file":"skills/whitebox/scripts/whitebox.mjs","start":282,"end":291,"kind":"code","lang":"js","description":"Composes the rules for code pieces: each one also gets a plain-language specification of its behaviour that states what the system does, not how the code is written.","id":"n162","text":"- For every [code] piece write ONE EXTRA FIELD, the description:  \u003cid>;\u003cpath>;\u003cdescription>   (required for code pieces, never for documentation pieces).\n- The description states WHAT the system does or guarantees at that point, as a requirement a reader could re-implement from: behaviour, inputs/outputs, rules, invariants, error handling, side effects. Plain present-tense English, 1-2 sentences, at most 40 words, no \";\" and no code. Do not narrate the code (\"loops over...\", \"calls...\"); name public identifiers only when the behaviour depends on them.\n- Path segments name CAPABILITIES and behaviours (\"Retry Failed Deployments\", \"Reject Expired Tokens\"), never files, packages, functions or types. Group by capability across files, not by directory layout.\n- Imports, boilerplate and trivial glue still get a piece line (path ending like \"Module Setup\") with a few-word description.\n` : \"\";\n  console.log(`TASK  (group ${g}, window ${w}/${G.windows.length}: pieces ${win.from}-${win.to})\nYou are building one branch of an outline of a project (documentation and/or source code). Below are NUMBERED PIECES (short excerpts, in document order).\nPlace every piece in a tree by writing ONE LINE per piece:\n\n    \u003cid>;\u003cTheme>/\u003cSub Theme>/.../\u003cPiece Title>${hasCode ? \"[;\u003cdescription> for code pieces]\" : \"\"}"},{"title":"Print Task Rules","file":"skills/whitebox/scripts/whitebox.mjs","start":293,"end":304,"kind":"code","lang":"js","description":"Prints the numbered task rules for a window, including its id range, the path segment format, the depth limits and the requirement that every id appears exactly once.","id":"n163","text":"RULES\n- Every id from ${win.from} to ${win.to} exactly once, ascending. Nothing else in the file (no comments, no blank explanations).\n- Each path segment is 2-4 words, Title Case, no \";\" \"/\" quotes or trailing punctuation. The LAST segment names that piece's single idea; the segments before it are branches.\n- Depth 3 to 5 segments. Aim for 2-9 children per branch: split a bigger one by adding a sub-branch level; do not make single-child branches.\n- Group by MEANING, not blindly by heading or file: consecutive pieces of one section usually share a branch, but a heading is only a hint.\n- Reuse branches from EXISTING BRANCHES below (exact spelling) when a piece belongs there; add new branches only when needed.\n- Full paths must be unique, and one piece's path must never equal a prefix of another's.\n- Never use a bare requirement id as a segment (\"R-012\" alone); \"R-012 Black Keys\" is fine.\n${codeRules}\nDO THIS\n1. Write the lines to  ${out}  with the Write tool.\n2. Write a summary (max 60 words, plain text) to  ${sum}  saying what this group covers so far (build on the previous summary)."},{"title":"Print Piece Listing","file":"skills/whitebox/scripts/whitebox.mjs","start":305,"end":322,"kind":"code","lang":"js","description":"Prints the instructions, the previous summary, the existing branches, and then each piece under a heading naming its file.","id":"n164","text":"3. Run:  node ${SELF} check ${g} ${w} --work ${path.relative(process.cwd(), WORK) || \".\"}   and fix the files until it prints OK.\nReply with just \"done\".\n\nPREVIOUS SUMMARY: ${prevSum || \"(first window)\"}\n\nEXISTING BRANCHES (path (pieces so far)):\n${vl.length ? vl.map(([p, n]) => `${p} (${n})`).join(\"\\n\") : \"(none yet)\"}\n\nPIECES`);\n  let lastF = -1, lastHp = null;\n  for (let i = win.from; i \u003c= win.to; i++) {\n    const p = P().pieces[i - 1];\n    if (p.f !== lastF) { console.log(`\\n## FILE ${P().files[p.f].rel}`); lastF = p.f; lastHp = null; }\n    if (p.k === \"c\") { console.log(`${p.i} [code ${p.lang}] ${p.sn}`); continue; }\n    if (p.hp !== lastHp) { console.log(`# ${p.hp || \"(no heading)\"}`); lastHp = p.hp; }\n    console.log(`${p.i} ${p.sn}`);\n  }\n}"}],"description":"Printing the window task with branch vocabulary, code rules and the piece listing.","id":"n160"},{"title":"Check Window Rows","children":[{"title":"Validate Window Row Format","file":"skills/whitebox/scripts/whitebox.mjs","start":324,"end":339,"kind":"code","lang":"js","description":"Validates each row of a window output: ids must be integers within the window range and unique, and each path must be a well-formed multi-segment title path.","id":"n166","text":"/* ---------------- check ---------------- */\nfunction checkWindow(g, w) {\n  const G = GR().find(x => x.g === g), win = G.windows.find(x => x.w === w);\n  const errs = [], rows = readOut(g, w);\n  if (!rows) return [`${outFile(g, w)} not found`];\n  const seen = new Set(), paths = new Map();\n  rows.forEach((r, n) => {\n    if (!Number.isInteger(r.id) || r.id \u003c win.from || r.id > win.to) { errs.push(`line ${n + 1}: bad id \"${r.id}\" (need ${win.from}-${win.to}, format id;path)`); return; }\n    if (seen.has(r.id)) errs.push(`id ${r.id} appears twice`); seen.add(r.id);\n    const s = r.path.split(\"/\");\n    if (s.length \u003c 2 || s.length > 6) errs.push(`id ${r.id}: depth ${s.length} (need 3-5 segments, minimum 2)`);\n    s.forEach(x => { if (!segsOk(x)) errs.push(`id ${r.id}: segment \"${x}\" must be 2-4 words`); });\n    if (P().pieces[r.id - 1]?.k === \"c\") { const dw = W(r.desc); if (!r.desc) errs.push(`id ${r.id}: code piece needs a description (id;path;description)`); else if (dw > 45) errs.push(`id ${r.id}: description has ${dw} words (max 40)`); }\n    if (paths.has(r.path)) errs.push(`id ${r.id}: path duplicates id ${paths.get(r.path)} (\"${r.path}\")`); paths.set(r.path, r.id);\n  });\n  for (const r of rows) for (const [p, id] of paths) if (p.startsWith(r.path + \"/\")) { errs.push(`id ${r.id}: path \"${r.path}\" is also a prefix of id ${id}'s path`); break; }"},{"title":"Verify Full Id Coverage","file":"skills/whitebox/scripts/whitebox.mjs","start":340,"end":350,"kind":"code","lang":"js","description":"Reports ids from the window range that have no row, requires the window summary file to exist, and rejects summaries longer than one hundred twenty words.","id":"n167","text":"  const miss = []; for (let i = win.from; i \u003c= win.to; i++) if (!seen.has(i)) miss.push(i);\n  if (miss.length) errs.push(`${miss.length} ids missing: ${miss.slice(0, 20).join(\",\")}${miss.length > 20 ? \"…\" : \"\"}`);\n  if (!fs.existsSync(sumFile(g, w))) errs.push(`summary file ${sumFile(g, w)} missing`);\n  else if (W(fs.readFileSync(sumFile(g, w), \"utf8\")) > 120) errs.push(\"summary longer than 120 words\");\n  return errs;\n}\nfunction cmdCheck() {\n  const errs = checkWindow(+pos[0], +pos[1]);\n  if (errs.length) { console.log(errs.slice(0, 40).map(e => \"ERROR: \" + e).join(\"\\n\") + (errs.length > 40 ? `\\n… ${errs.length - 40} more` : \"\")); process.exit(1); }\n  console.log(\"OK\");\n}"}],"description":"Validating window row format and verifying that every full id is covered.","id":"n165"},{"title":"Check All Windows","children":[{"title":"Report Failing Windows","file":"skills/whitebox/scripts/whitebox.mjs","start":352,"end":359,"kind":"code","lang":"js","description":"Checks every window of every group and prints a JSON list of failing windows with their error details.","id":"n169","text":"function cmdCheckAll() {\n  const bad = [];\n  for (const G of GR()) for (const w of G.windows) { const e = checkWindow(G.g, w.w); if (e.length) bad.push({ g: G.g, w: w.w, first: e[0] }); }\n  console.log(JSON.stringify({ failing: bad.map(b => ({ g: b.g, w: b.w })), detail: bad.slice(0, 10) }));\n}\n\n/* ---------------- group trees / merge ---------------- */\nfunction groupRows(g) { const G = GR().find(x => x.g === g), rows = []; for (const w of G.windows) rows.push(...(readOut(g, w.w) || [])); return rows; }"},{"title":"Report Overall Progress","file":"skills/whitebox/scripts/whitebox.mjs","start":360,"end":364,"kind":"code","lang":"js","description":"Walks all groups and windows and prints the progress of each group together with the overall count of finished windows.","id":"n170","text":"function status() {\n  let done = 0, tot = 0; const lines = [];\n  for (const G of GR()) { let d = 0; for (const w of G.windows) { tot++; const r = readOut(G.g, w.w); if (r && r.length === w.to - w.from + 1 && fs.existsSync(sumFile(G.g, w.w))) { d++; done++; } } lines.push(`group ${G.g}: ${d}/${G.windows.length} windows`); }\n  console.log(lines.join(\"\\n\") + `\\n${done}/${tot} windows done`);\n}"}],"description":"Reporting failing windows and overall progress across all windows.","id":"n168"}],"description":"Cutting pieces into balanced groups and windows for model tasks, then checking and reporting their results.","id":"n150"},{"title":"Themes And Reshaping","children":[{"title":"Prepare Merge Instructions","children":[{"title":"Print Merge Input","file":"skills/whitebox/scripts/whitebox.mjs","start":365,"end":380,"kind":"code","lang":"js","description":"Prints a merge listing for each group with its files, top-level branches, piece counts and sample sub-branches.","id":"n173","text":"function cmdMergeInput() {\n  const lines = [];\n  for (const G of GR()) {\n    const rows = groupRows(G.g); if (!rows.length) die(`group ${G.g} has no output yet`);\n    const sums = G.windows.map(w => w.w).filter(w => fs.existsSync(sumFile(G.g, w))); const sum = sums.length ? fs.readFileSync(sumFile(G.g, sums.at(-1)), \"utf8\").trim() : \"\";\n    const top = new Map();\n    for (const r of rows) { const s = r.path.split(\"/\"); const t = s[0]; if (!top.has(t)) top.set(t, { n: 0, sub: new Map() }); const o = top.get(t); o.n++; if (s.length > 2) o.sub.set(s[1], (o.sub.get(s[1]) || 0) + 1); }\n    lines.push(`\\n### GROUP ${G.g}  (${G.files.length} files: ${G.files.slice(0, 3).join(\", \")}${G.files.length > 3 ? \", …\" : \"\"}; ${rows.length} pieces)\\nSummary: ${sum}`);\n    for (const [t, o] of top) lines.push(`${G.g};${t}   [${o.n} pieces]  children: ${[...o.sub].slice(0, 8).map(([k, n]) => `${k} (${n})`).join(\", \")}`);\n  }\n  console.log(`TASK\nSeveral agents each outlined a part (\"group\") of one big specification. Merge their outlines into ONE coherent tree.\nEach line under GROUPS is a top-level branch of one group:  \u003cgroup>;\u003cTop Segment>  [pieces]  children...\nDecide where every such branch is mounted in the final tree by writing ONE LINE per (group, top segment):\n\n    \u003cgroup>;\u003cTop Segment exactly as shown>;\u003cNew/Path/Prefix>"},{"title":"Compose Merge Rules","file":"skills/whitebox/scripts/whitebox.mjs","start":382,"end":392,"kind":"code","lang":"js","description":"Describes the merge rules: each group top segment maps to a new prefix, shared themes share one prefix, and the final tree has three to eight top-level branches.","id":"n174","text":"The pieces below  \u003cTop Segment>  are re-mounted under  \u003cNew/Path/Prefix>  (the top segment is replaced by the prefix).\nRULES\n- Every (group, top segment) listed exactly once; copy the group number and segment text exactly.\n- The final tree must have 3 to 8 top-level branches (first segments of New Path Prefix), each 2-4 words, Title Case.\n- Different groups/segments covering the same theme MUST be given the same prefix so they merge into one branch (e.g. several \"Screens ...\" segments from groups 4-6 all go under \"Frontend/Screens And Navigation\").\n- Prefix has 1 or 2 segments (each 2-4 words, Title Case, no \";\" or quotes). Use 2 when a theme needs a parent so that no branch ends up with more than ~9 children. Keep the original document order of themes where possible.\n- Don't invent content; do not drop any branch.\nWrite the lines to ${path.relative(process.cwd(), wp(\"merge.txt\"))} with the Write tool, then run:  node ${SELF} apply-merge --work ${path.relative(process.cwd(), WORK) || \".\"}   and fix the file until it prints OK. Reply with just \"done\".\n\nGROUPS${lines.join(\"\\n\")}`);\n}"}],"description":"Printing the merge input and composing the rules for merging branches.","id":"n172"},{"title":"Apply Merge Mapping","children":[{"title":"Read Merge Mapping File","file":"skills/whitebox/scripts/whitebox.mjs","start":393,"end":396,"kind":"code","lang":"js","description":"Reads the merge mapping file into one mapping per group and top segment, and fails with a clear message when the file is missing.","id":"n176","text":"function readMerge() {\n  const f = wp(\"merge.txt\"); if (!fs.existsSync(f)) die(\"ERROR: merge.txt not found\");\n  return fs.readFileSync(f, \"utf8\").split(\"\\n\").map(l => l.trim()).filter(Boolean).map(l => { const a = l.split(\";\"); return { g: +a[0], top: (a[1] || \"\").trim(), prefix: (a.slice(2).join(\";\") || \"\").trim() }; });\n}"},{"title":"Remap Group Top Segments","file":"skills/whitebox/scripts/whitebox.mjs","start":397,"end":408,"kind":"code","lang":"js","description":"Replaces the top segment of every row with its mapped prefix, and fails when a group and segment has no mapping or has two.","id":"n177","text":"function cmdApplyMerge() {\n  if (fs.existsSync(wp(\"reshape.applied\")) && !argv.includes(\"--force\")) die(\"ERROR: reshape results were already applied to tree.paths; re-running apply-merge would discard them. Pass --force only if you want to start the reshape phase over (and delete \" + wp(\"reshape.applied\") + \").\");\n  const M = readMerge(), errs = [], map = new Map();\n  for (const m of M) { const k = m.g + \";\" + m.top; if (map.has(k)) errs.push(`duplicate mapping for ${k}`); map.set(k, m.prefix); const s = m.prefix.split(\"/\"); if (!m.prefix || s.length > 2 || !s.every(segsOk)) errs.push(`bad prefix \"${m.prefix}\" for ${k} (1-2 segments of 2-4 words)`); }\n  const rowsAll = [];\n  for (const G of GR()) {\n    const rows = groupRows(G.g), tops = new Set(rows.map(r => r.path.split(\"/\")[0]));\n    for (const t of tops) if (!map.has(G.g + \";\" + t)) errs.push(`missing mapping for ${G.g};${t}`);\n    for (const r of rows) { const s = r.path.split(\"/\"), pre = map.get(G.g + \";\" + s[0]); if (pre) rowsAll.push({ g: G.g, id: r.id, path: pre + \"/\" + s.slice(1).join(\"/\"), desc: r.desc }); }\n  }\n  const tops = new Set([...map.values()].map(p => p.split(\"/\")[0]));\n  if (tops.size \u003c 3 || tops.size > 8) errs.push(`final tree has ${tops.size} top-level branches (need 3-8): ${[...tops].join(\" | \")}`);"},{"title":"Resolve Path Collisions","file":"skills/whitebox/scripts/whitebox.mjs","start":409,"end":419,"kind":"code","lang":"js","description":"Resolves duplicate paths and paths that are prefixes of other paths by adding a numeric suffix, then writes the final tree paths and leaf descriptions.","id":"n178","text":"  if (errs.length) { console.log(errs.slice(0, 30).map(e => \"ERROR: \" + e).join(\"\\n\")); process.exit(1); }\n  // resolve leaf/prefix and duplicate collisions deterministically\n  rowsAll.sort((a, b) => a.id - b.id);\n  const used = new Set(), prefixes = new Set(); rowsAll.forEach(r => { const s = r.path.split(\"/\"); for (let d = 1; d \u003c s.length; d++) prefixes.add(s.slice(0, d).join(\"/\")); });\n  let fixes = 0;\n  for (const r of rowsAll) { let p = r.path, n = 1; while (used.has(p) || prefixes.has(p)) { n++; const s = r.path.split(\"/\"); const last = s.pop(); p = [...s, (last.split(\" \").length >= 4 ? last.split(\" \").slice(0, 3).join(\" \") : last) + \" \" + n].join(\"/\"); } if (p !== r.path) { fixes++; r.path = p; } used.add(p); }\n  fs.writeFileSync(wp(\"tree.paths\"), rowsAll.map(r => `${r.g};${r.path};${P().files[P().pieces[r.id - 1].f].rel}:${P().pieces[r.id - 1].s}-${P().pieces[r.id - 1].e}`).join(\"\\n\") + \"\\n\");\n  const leafdesc = {}; for (const r of rowsAll) { const pc = P().pieces[r.id - 1]; if (pc.k === \"c\" && r.desc) leafdesc[`${P().files[pc.f].rel}:${pc.s}-${pc.e}`] = r.desc; }\n  fs.writeFileSync(wp(\"leafdesc.json\"), JSON.stringify(leafdesc));\n  // width report\n  const kids = new Map(); for (const r of rowsAll) { const s = r.path.split(\"/\"); for (let d = 0; d \u003c s.length; d++) { const par = s.slice(0, d).join(\"/\"), ch = s[d]; if (!kids.has(par)) kids.set(par, new Set()); kids.get(par).add(ch); } }"}],"description":"Reading a merge mapping file and remapping groups while resolving path collisions.","id":"n175"},{"title":"Branch Width Counts","children":[{"title":"Report Tree Width","file":"skills/whitebox/scripts/whitebox.mjs","start":420,"end":426,"kind":"code","lang":"js","description":"Reports the number of pieces and top-level branches, with a warning listing the branches that have more than nine children.","id":"n180","text":"  const wide = [...kids].filter(([, s]) => s.size > 9).sort((a, b) => b[1].size - a[1].size);\n  console.log(`OK  ${rowsAll.length} pieces, ${tops.size} top-level branches${fixes ? `, ${fixes} path collisions auto-renamed` : \"\"}`);\n  if (wide.length) { console.log(`${wide.length} branches have >9 children (worst: ${wide.slice(0, 8).map(([p, s]) => `${p || \"(root)\"}: ${s.size}`).join(\"; \")})`); }\n}\n\n/* ---------------- describe ---------------- */\nfunction treeRows() { if (!fs.existsSync(wp(\"tree.paths\"))) die(\"run apply-merge first\"); return fs.readFileSync(wp(\"tree.paths\"), \"utf8\").split(\"\\n\").filter(Boolean).map(l => { const a = l.split(\";\"); return { g: +a[0], path: a[1], range: a[2] }; }); }"},{"title":"Count Children Per Branch","file":"skills/whitebox/scripts/whitebox.mjs","start":460,"end":464,"kind":"code","lang":"js","description":"Counts the children of each branch in the tree, whether leaf or sub-branch, and returns the counts keyed by branch path.","id":"n181","text":"function widths(rows) {\n  const kids = new Map();\n  for (const r of rows) { const s = r.path.split(\"/\"); for (let d = 1; d \u003c s.length; d++) { const par = s.slice(0, d).join(\"/\"); if (!kids.has(par)) kids.set(par, new Map()); const m = kids.get(par); const o = m.get(s[d]) || { n: 0, leaf: false }; o.n++; o.leaf = d === s.length - 1; m.set(s[d], o); } }\n  return kids;\n}"}],"description":"Counting children per branch and reporting how wide the tree is.","id":"n179"},{"title":"Describe Branch Text","children":[{"title":"Print Branch Description Task","file":"skills/whitebox/scripts/whitebox.mjs","start":427,"end":440,"kind":"code","lang":"js","description":"Prints a task listing each branch up to depth three with example children and asks for one-sentence descriptions written to the group description file.","id":"n183","text":"function cmdDescribeInput() {\n  const g = +pos[0], rows = treeRows().filter(r => r.g === g);\n  const br = new Map();\n  for (const r of rows) { const s = r.path.split(\"/\"); for (let d = 1; d \u003c s.length && d \u003c= 3; d++) { const p = s.slice(0, d).join(\"/\"); if (!br.has(p)) br.set(p, { n: 0, ch: new Set() }); const o = br.get(p); o.n++; o.ch.add(s[d]); } }\n  const list = [...br].sort((a, b) => a[0].localeCompare(b[0]));\n  console.log(`TASK\nWrite a one-sentence description (max 20 words, plain text, no quotes or \";\") for each BRANCH below, saying what that part of the specification covers. Use the child titles as evidence.\nOutput ONE LINE per branch, exactly:   \u003cBranch/Path exactly as shown>;\u003cdescription>\nWrite the lines to ${path.relative(process.cwd(), wp(\"desc\", `g${g}.txt`))} with the Write tool (every branch exactly once), then run:\n  node ${SELF} check-desc ${g} --work ${path.relative(process.cwd(), WORK) || \".\"}   and fix until it prints OK. Reply with just \"done\".\n\nBRANCHES (${list.length})\n${list.map(([p, o]) => `${p}   [${o.n} pieces]  children: ${[...o.ch].slice(0, 8).join(\", \")}`).join(\"\\n\")}`);\n}"},{"title":"Verify Branch Descriptions","file":"skills/whitebox/scripts/whitebox.mjs","start":441,"end":452,"kind":"code","lang":"js","description":"Checks that every branch up to depth three of the group has a non-empty description, and fails listing the branch paths that lack one.","id":"n184","text":"function cmdCheckDesc() {\n  const g = +pos[0], f = wp(\"desc\", `g${g}.txt`); if (!fs.existsSync(f)) die(`ERROR: ${f} not found`);\n  const rows = treeRows().filter(r => r.g === g), need = new Set();\n  for (const r of rows) { const s = r.path.split(\"/\"); for (let d = 1; d \u003c s.length && d \u003c= 3; d++) need.add(s.slice(0, d).join(\"/\")); }\n  const got = new Map(); for (const l of fs.readFileSync(f, \"utf8\").split(\"\\n\").filter(x => x.trim())) { const k = l.indexOf(\";\"); got.set(l.slice(0, k).trim(), l.slice(k + 1).trim()); }\n  const errs = []; for (const p of need) if (!got.get(p)) errs.push(`missing description for \"${p}\"`); for (const [p, d] of got) { if (!need.has(p)) errs.push(`unknown branch \"${p}\"`); else if (W(d) > 30) errs.push(`description too long for \"${p}\"`); }\n  if (errs.length) { console.log(errs.slice(0, 30).map(e => \"ERROR: \" + e).join(\"\\n\")); process.exit(1); }\n  console.log(\"OK\");\n}\n\n/* ---------------- reshape wide branches ---------------- */\nconst SELFREL = path.relative(process.cwd(), WORK) || \".\";"},{"title":"Load And Save Descriptions","file":"skills/whitebox/scripts/whitebox.mjs","start":453,"end":459,"kind":"code","lang":"js","description":"Loads branch descriptions from the description folder into one map and saves the combined map back to a single file.","id":"n185","text":"function loadDesc() {\n  const all = wp(\"desc\", \"_all.txt\"), m = new Map();\n  const files = fs.existsSync(all) ? [all] : fs.existsSync(wp(\"desc\")) ? fs.readdirSync(wp(\"desc\")).filter(f => /^g\\d+\\.txt$/.test(f)).sort().map(f => wp(\"desc\", f)) : [];\n  for (const f of files) for (const l of fs.readFileSync(f, \"utf8\").split(\"\\n\").filter(x => x.trim())) { const k = l.indexOf(\";\"); const key = l.slice(0, k).trim(); if (!m.has(key)) m.set(key, l.slice(k + 1).trim()); }\n  return m;\n}\nconst saveDesc = m => fs.writeFileSync(wp(\"desc\", \"_all.txt\"), [...m].map(([k, v]) => `${k};${v}`).join(\"\\n\") + \"\\n\");"}],"description":"Printing description tasks, verifying branch descriptions and loading or saving them.","id":"n182"},{"title":"Reshape Plan","children":[{"title":"List Wide Branches","file":"skills/whitebox/scripts/whitebox.mjs","start":465,"end":477,"kind":"code","lang":"js","description":"Lists branches with more than nine children sorted by child count, numbers them for reshaping, and moves earlier reshape results aside.","id":"n187","text":"function cmdReshapeList() {\n  const rows = treeRows(), kids = widths(rows);\n  const wide = [...kids].filter(([, m]) => m.size > 9).map(([p, m]) => ({ path: p, n: m.size })).sort((a, b) => a.path.localeCompare(b.path));\n  if (fs.existsSync(wp(\"reshape\")) && fs.readdirSync(wp(\"reshape\")).length) fs.renameSync(wp(\"reshape\"), wp(`reshape-archive-${Date.now()}`));\n  fs.mkdirSync(wp(\"reshape\"), { recursive: true });\n  fs.writeFileSync(wp(\"wide.json\"), JSON.stringify(wide));\n  console.log(JSON.stringify({ count: wide.length, worst: wide.slice().sort((a, b) => b.n - a.n).slice(0, 5) }));\n}\nconst WIDE = () => readJ(wp(\"wide.json\"));\nfunction cmdReshapeCount() {\n  const kids = widths(treeRows()), wide = [...kids].filter(([, m]) => m.size > 9);\n  console.log(JSON.stringify({ count: wide.length, readOnly: true }));\n}"},{"title":"Print Reshape Task","file":"skills/whitebox/scripts/whitebox.mjs","start":478,"end":487,"kind":"code","lang":"js","description":"Prints the task for one wide branch, showing each child with its piece count or sample text, and the instructions for writing its grouping file.","id":"n188","text":"function cmdReshapeInput() {\n  const n = +pos[0], w = WIDE()[n - 1]; if (!w) die(\"no such wide branch\");\n  const rows = treeRows(), byStart = new Map(P().pieces.map(p => [P().files[p.f].rel + \":\" + p.s, p])), ld = fs.existsSync(wp(\"leafdesc.json\")) ? readJ(wp(\"leafdesc.json\")) : {};\n  const ch = new Map();\n  for (const r of rows) { if (!r.path.startsWith(w.path + \"/\")) continue; const s = r.path.slice(w.path.length + 1).split(\"/\"); const c = s[0]; if (!ch.has(c)) ch.set(c, { n: 0, sub: [], leaf: s.length === 1, sn: \"\" }); const o = ch.get(c); o.n++; if (s.length > 1) { o.leaf = false; if (o.sub.length \u003c 3 && !o.sub.includes(s[1])) o.sub.push(s[1]); } else { const pc = byStart.get(r.range.slice(0, r.range.lastIndexOf(\"-\"))); o.sn = ld[r.range] || (pc && pc.k !== \"c\" ? pc.sn.split(\" \").slice(0, 14).join(\" \") : \"\"); } }\n  console.log(`TASK\nThe branch \"${w.path}\" of a specification outline has ${ch.size} children, too many to survey. Group them into 3 to 7 themed groups.\nWrite ONE LINE per child, exactly:    \u003cChild Title exactly as shown>;\u003cGroup Title>;\u003cdescription>\n- Every child exactly once. All children of one group get the identical Group Title and description.\n- Group Title: 2-4 words, Title Case, no \";\" or \"/\" or quotes, different from every child title."},{"title":"Compose Reshape Rules","file":"skills/whitebox/scripts/whitebox.mjs","start":488,"end":499,"kind":"code","lang":"js","description":"Gives the rules for grouping the children of a wide branch into two to nine groups with unique titles, and reads the grouping file into child and group pairs.","id":"n189","text":"- description: one sentence, max 20 words, saying what the group covers.\n- Each group should end up with 2-9 children; keep children of a group close in the original order where the theme allows.\nWrite the lines to ${path.relative(process.cwd(), wp(\"reshape\", `r${n}.txt`))} with the Write tool, then run:\n  node ${SELF} check-reshape ${n} --work ${SELFREL}   and fix the file until it prints OK. Reply with just \"done\".\n\nCHILDREN of \"${w.path}\"\n${[...ch].map(([c, o]) => `${c}   ${o.leaf ? \"[piece] \" + o.sn : `[branch, ${o.n} pieces] ${o.sub.join(\", \")}`}`).join(\"\\n\")}`);\n}\nfunction readReshape(n) {\n  const f = wp(\"reshape\", `r${n}.txt`); if (!fs.existsSync(f)) return null;\n  return fs.readFileSync(f, \"utf8\").split(\"\\n\").map(l => l.trim()).filter(Boolean).map(l => { const a = l.split(\";\"); return { child: a[0].trim(), group: (a[1] || \"\").trim(), desc: a.slice(2).join(\";\").trim() }; });\n}"}],"description":"Listing wide branches and printing the reshape task with its composed rules.","id":"n186"},{"title":"Reshape Results","children":[{"title":"Validate Reshape Groups","file":"skills/whitebox/scripts/whitebox.mjs","start":500,"end":514,"kind":"code","lang":"js","description":"Validates a grouping file: each child appears exactly once, group titles are two to four words and differ from every child title, and each group holds two to nine children.","id":"n191","text":"function cmdCheckReshape() {\n  const n = +pos[0], w = WIDE()[n - 1], rows = readReshape(n); if (!rows) die(`ERROR: reshape file r${n}.txt not found`);\n  const kids = widths(treeRows()).get(w.path), errs = [], seen = new Set(), groups = new Map();\n  for (const r of rows) {\n    if (!kids.has(r.child)) { errs.push(`unknown child \"${r.child}\"`); continue; }\n    if (seen.has(r.child)) errs.push(`child \"${r.child}\" appears twice`); seen.add(r.child);\n    if (!segsOk(r.group) || r.group.includes(\"/\")) errs.push(`group title \"${r.group}\" must be 2-4 words without ; or /`);\n    if (kids.has(r.group)) errs.push(`group title \"${r.group}\" equals an existing child title`);\n    groups.set(r.group, (groups.get(r.group) || 0) + 1);\n  }\n  for (const c of kids.keys()) if (!seen.has(c)) errs.push(`child \"${c}\" missing`);\n  if (groups.size \u003c 2) errs.push(\"need at least 2 groups\"); if (groups.size > 9) errs.push(\"at most 9 groups\");\n  if (errs.length) { console.log(errs.slice(0, 30).map(e => \"ERROR: \" + e).join(\"\\n\")); process.exit(1); }\n  console.log(\"OK\");\n}"},{"title":"Remount Children Under Groups","file":"skills/whitebox/scripts/whitebox.mjs","start":515,"end":532,"kind":"code","lang":"js","description":"Moves the children of each wide branch under their group titles, deepest branches first, carrying descriptions along, and skips branches that have no grouping file.","id":"n192","text":"function cmdApplyReshape() {\n  const rows = treeRows(), wide = WIDE(), desc = loadDesc(); let applied = 0, skipped = 0;\n  const order = wide.map((w, i) => ({ ...w, n: i + 1 })).sort((a, b) => b.path.split(\"/\").length - a.path.split(\"/\").length);\n  for (const w of order) {\n    const rr = readReshape(w.n); if (!rr) { skipped++; continue; }\n    const map = new Map(rr.map(r => [r.child, r.group]));\n    for (const r of rows) if (r.path.startsWith(w.path + \"/\")) { const s = r.path.slice(w.path.length + 1).split(\"/\"); const g = map.get(s[0]); if (g) r.path = [w.path, g, ...s].join(\"/\"); }\n    const nd = new Map();\n    for (const [k, v] of desc) { if (k.startsWith(w.path + \"/\")) { const s = k.slice(w.path.length + 1).split(\"/\"); const g = map.get(s[0]); nd.set(g ? [w.path, g, ...s].join(\"/\") : k, v); } else nd.set(k, v); }\n    desc.clear(); nd.forEach((v, k) => desc.set(k, v));\n    for (const r of rr) if (r.desc && !desc.has(w.path + \"/\" + r.group)) desc.set(w.path + \"/\" + r.group, r.desc);\n    applied++;\n  }\n  fs.writeFileSync(wp(\"tree.paths\"), rows.map(r => `${r.g};${r.path};${r.range}`).join(\"\\n\") + \"\\n\"); saveDesc(desc);\n  if (applied) fs.writeFileSync(wp(\"reshape.applied\"), \"1\");\n  const still = [...widths(rows)].filter(([, m]) => m.size > 9).length;\n  console.log(`OK  reshaped ${applied} branches${skipped ? `, ${skipped} had no result` : \"\"}; ${still} branches still wider than 9`);\n}"}],"description":"Validating reshape groups and remounting children under their new groups.","id":"n190"}],"description":"Applying merges, describing branches and reshaping the tree when branches are too wide.","id":"n171"}],"description":"Command line tool that surveys code and specs, reshapes branches, and applies editor edits.","id":"n108"},{"title":"Workflow And Testing","children":[{"title":"Workflow Orchestration","children":[{"title":"Phase Execution","children":[{"title":"Declare Workflow Phases","file":"skills/whitebox/workflow.js","start":1,"end":18,"kind":"code","lang":"js","description":"Declares the workflow name and description and five phases, Outline, Verify, Merge, Describe and Reshape, each run by a haiku model.","id":"n196","text":"export const meta = {\n  name: 'whitebox',\n  description: 'Turn a split markdown spec into one tree with haiku agents: outline groups, verify, merge, describe, reshape wide branches',\n  phases: [\n    { title: 'Outline', detail: 'one haiku chain per group, windows in order', model: 'haiku' },\n    { title: 'Verify', detail: 'check-all, redo failing windows', model: 'haiku' },\n    { title: 'Merge', detail: 'one haiku agent mounts group outlines into one tree', model: 'haiku' },\n    { title: 'Describe', detail: 'one haiku agent per group writes branch descriptions', model: 'haiku' },\n    { title: 'Reshape', detail: 'regroup branches wider than 9, repeat until none', model: 'haiku' },\n  ],\n}\n// args = output of:  node \u003ccli> groups-args --work \u003cW>   ->  {work, cli, groups:[{g, windows}]}\nconst WORK = args.work\nconst CLI = args.cli\nconst GROUPS = args.groups\nconst run = c => `node ${CLI} ${c} --work ${WORK}`\nconst H = { model: 'haiku' }\nconst TAIL = 'Read its ENTIRE output and carry out the TASK it describes exactly. Reply \"done\" when its final check prints OK.'"},{"title":"Outline Each Window","file":"skills/whitebox/workflow.js","start":20,"end":37,"kind":"code","lang":"js","description":"Runs each window of every group as a haiku agent in order, retrying a failed window up to two times before reporting it as failed.","id":"n197","text":"const winPrompt = (g, w) => `You work in the current project directory. First run \\`${run(`check ${g} ${w}`)}\\` with Bash; if it prints OK the window is already finished: reply \"done\" and stop. Otherwise run \\`${run(`window ${g} ${w}`)}\\` with Bash. ${TAIL}`\nasync function doWindow(g, w) {\n  for (let t = 0; t \u003c 2; t++) {\n    const r = await agent(winPrompt(g, w), { ...H, phase: 'Outline', label: `g${g} w${w}` })\n    if (r) return true\n  }\n  return false\n}\n\nphase('Outline')\nawait pipeline(GROUPS, async grp => {\n  for (let w = 1; w \u003c= grp.windows; w++) await doWindow(grp.g, w)\n  return grp.g\n})\n\nphase('Verify')\nconst FAIL = { type: 'object', properties: { failing: { type: 'array', items: { type: 'object', properties: { g: { type: 'number' }, w: { type: 'number' } }, required: ['g', 'w'] } } }, required: ['failing'] }\nlet failing = []"},{"title":"Redo Failing Windows","file":"skills/whitebox/workflow.js","start":38,"end":62,"kind":"code","lang":"js","description":"Runs up to three verification rounds over all windows, redoing only failing windows in group and window order and stopping once none fail.","id":"n198","text":"for (let round = 0; round \u003c 3; round++) {\n  const r = await agent(`Run \\`${run('check-all')}\\` with Bash. It prints one JSON line. Return the \"failing\" array from it unchanged.`, { ...H, phase: 'Verify', label: `check-all #${round + 1}`, schema: FAIL })\n  failing = r ? r.failing : []\n  log(`verify round ${round + 1}: ${failing.length} failing windows`)\n  if (!failing.length) break\n  const byG = {}\n  failing.forEach(f => (byG[f.g] ??= []).push(f.w))\n  await pipeline(Object.entries(byG), async ([g, ws]) => {\n    for (const w of ws.sort((a, b) => a - b)) await doWindow(+g, w)\n    return g\n  })\n}\nif (failing.length) log(`WARNING: ${failing.length} windows still failing: ${JSON.stringify(failing.slice(0, 20))}`)\n\nphase('Merge')\nawait agent(`You work in the current project directory. Run \\`${run('merge-input')}\\` with Bash. ${TAIL}`, { ...H, phase: 'Merge', label: 'merge' })\n\nphase('Describe')\nawait pipeline(GROUPS, async grp => {\n  await agent(`You work in the current project directory. Run \\`${run(`describe-input ${grp.g}`)}\\` with Bash. ${TAIL}`, { ...H, phase: 'Describe', label: `describe g${grp.g}` })\n  return grp.g\n})\n\nconst COUNT = { type: 'object', properties: { count: { type: 'number' } }, required: ['count'] }\nlet wide = null"},{"title":"Split Wide Branches","file":"skills/whitebox/workflow.js","start":63,"end":78,"kind":"code","lang":"js","description":"Repeats up to three rounds splitting branches wider than nine children, retrying each split up to two times and stopping when no branch is too wide.","id":"n199","text":"for (let round = 1; round \u003c= 3; round++) {\n  phase('Reshape')\n  const r = await agent(`Run \\`${run('reshape-list')}\\` with Bash. It prints one JSON line. Return its \"count\" field.`, { ...H, phase: 'Reshape', label: `list #${round}`, schema: COUNT })\n  wide = r ? r.count : 0\n  log(`reshape round ${round}: ${wide} wide branches`)\n  if (!wide) break\n  await pipeline(Array.from({ length: wide }, (_, i) => i + 1), async n => {\n    for (let t = 0; t \u003c 2; t++) {\n      const x = await agent(`You work in the current project directory. Run \\`${run(`reshape-input ${n}`)}\\` with Bash. ${TAIL}`, { ...H, phase: 'Reshape', label: `r${round} b${n}` })\n      if (x) return n\n    }\n    return null\n  })\n  await agent(`Run \\`${run('apply-reshape')}\\` with Bash and reply with its output line.`, { ...H, phase: 'Reshape', label: `apply #${round}` })\n}\nreturn { failingWindows: failing, wideBranchesLeft: wide }"}],"description":"Declares workflow phases and runs them, outlining windows, redoing failures and splitting wide branches.","id":"n195"}],"description":"Orchestration of workflow runs, centered on executing the declared phases in order.","id":"n194"},{"title":"Test Harness","children":[{"title":"Test Support","children":[{"title":"Module Setup","file":"test/helpers.mjs","start":1,"end":11,"kind":"code","lang":"js","description":"Provides repository root, scripts directory and CLI path constants, plus a helper that creates uniquely named temporary directories.","id":"n202","text":"import { spawnSync, execFileSync } from \"node:child_process\";\nimport fs from \"node:fs\";\nimport os from \"node:os\";\nimport path from \"node:path\";\nimport { fileURLToPath } from \"node:url\";\n\nexport const ROOT = path.resolve(path.dirname(fileURLToPath(import.meta.url)), \"..\");\nexport const SCRIPTS = path.join(ROOT, \"skills\", \"whitebox\", \"scripts\");\nexport const CLI = path.join(SCRIPTS, \"whitebox.mjs\");\n\nexport function tmp(prefix = \"wb-\") { return fs.mkdtempSync(path.join(os.tmpdir(), prefix)); }"},{"title":"Run Script Without Throwing","file":"test/helpers.mjs","start":13,"end":18,"kind":"code","lang":"js","description":"Runs a script with arguments and returns its exit code and combined output, returning failure details instead of raising an error.","id":"n203","text":"/** run a script, return {code, out}; never throws */\nexport function run(script, args, opts = {}) {\n  const r = spawnSync(\"node\", [script, ...args], { encoding: \"utf8\", cwd: opts.cwd, maxBuffer: 1 \u003c\u003c 28 });\n  return { code: r.status, out: (r.stdout || \"\") + (r.stderr || \"\"), stdout: r.stdout || \"\" };\n}\nexport const cli = (args, opts) => run(CLI, args, opts);"}],"description":"Helpers for module setup and for running scripts without throwing, used by tests.","id":"n201"},{"title":"Fixture Projects","children":[{"title":"Create Git Project","file":"test/helpers.mjs","start":20,"end":37,"kind":"code","lang":"js","description":"Creates a temporary directory from a map of relative paths to contents, optionally writes an ignore file and initializes a git repository.","id":"n205","text":"/** create a git project from {relpath: content}; returns its directory */\nexport function project(files, { git = true, ignore = \"\" } = {}) {\n  const dir = tmp(\"wb-proj-\");\n  for (const [rel, content] of Object.entries(files)) {\n    const p = path.join(dir, rel); fs.mkdirSync(path.dirname(p), { recursive: true });\n    fs.writeFileSync(p, content);\n  }\n  if (ignore) fs.writeFileSync(path.join(dir, \".gitignore\"), ignore);\n  if (git) { execFileSync(\"git\", [\"init\", \"-q\"], { cwd: dir }); }\n  return dir;\n}\n\nexport const readJson = p => JSON.parse(fs.readFileSync(p, \"utf8\"));\n\n/**\n * A stand-in for the Haiku agents: writes deterministic window outputs, merge file and descriptions\n * so that the whole pipeline (check -> apply-merge -> check-desc -> build) runs without an LLM.\n */"},{"title":"Build Sample Project","file":"test/helpers.mjs","start":65,"end":82,"kind":"code","lang":"js","description":"Builds a sample project of nine markdown topic files with numbered rules, plus Go and Python sources, large enough to produce at least three groups.","id":"n206","text":"/** a sample project mixing docs and code, big enough for 3+ groups */\nexport function sampleProject() {\n  const f = {};\n  for (let i = 1; i \u003c= 9; i++) {\n    f[`docs/topic${i}.md`] = `# Topic ${i}\\n\\nIntro paragraph for topic ${i}.\\n\\n## Rules\\n\\n- [R-${i}01] First rule of topic ${i}.\\n- [R-${i}02] Second rule of topic ${i}.\\n\\n| Key | Meaning |\\n|---|---|\\n| a | alpha ${i} |\\n`;\n  }\n  f[\"src/server.go\"] = GO;\n  f[\"src/util.py\"] = PY;\n  return sampleFiles(f);\n}\nconst sampleFiles = f => project(f, { ignore: \"ignored.md\\n\" });\n\nconst fill = (n, tpl) => Array.from({ length: n }, (_, i) => tpl(i)).join(\"\\n\");\nexport const GO = `package server\n\nimport (\n\\t\"fmt\"\n)"},{"title":"Go Greeting Handler Fixture","file":"test/helpers.mjs","start":84,"end":121,"kind":"code","lang":"js","description":"Provides a Go fixture whose Handle returns a fixed message for an empty name and a greeting otherwise, and whose Helper formats a value for logging.","id":"n207","text":"// Handle answers one request and validates the caller name before greeting.\nfunc Handle(name string) string {\n${fill(8, i => `\\tstep${i} := compute(name, ${i}, \"alpha\", \"beta\", \"gamma\", \"delta\")`)}\n\\tif name == \"\" {\n\\t\\treturn \"empty\"\n\n\\t}\n\\treturn fmt.Sprintf(\"hi %s\", name)\n}\n\n// Helper formats a value for the log line and counts how often it was called.\nfunc Helper(v int) string {\n${fill(8, i => `\\tlogLine${i} := format(v, ${i}, \"alpha\", \"beta\", \"gamma\", \"delta\", \"epsilon\")`)}\n\\treturn \"ok\"\n}\n\n// Tiny is small.\nfunc Tiny() int { return 1 }\n`;\nexport const PY = `import os\n\n\n@decorator\ndef load(path):\n    \"\"\"Load a file and normalise every line of it before returning the text.\"\"\"\n${fill(8, i => `    step_${i} = normalise(path, ${i}, \"alpha\", \"beta\", \"gamma\", \"delta\", \"epsilon\")`)}\n\n    with open(path) as f:\n        return f.read()\n\n\nclass Cache:\n    \"\"\"Keeps recent values.\"\"\"\n${fill(8, i => `    attr_${i} = make_attribute(${i}, \"alpha\", \"beta\", \"gamma\", \"delta\", \"epsilon\", \"zeta\")`)}\n\n    def get(self, k):\n        return k\n`;"}],"description":"Fixture projects for tests: a git repository, a sample build and a Go greeting handler.","id":"n204"},{"title":"Fake Agents","children":[{"title":"Simulate Outline Agents","file":"test/helpers.mjs","start":38,"end":55,"kind":"code","lang":"js","description":"Writes stand-in outline summaries and valid piece lines for every window of each group, deriving short theme names from source file names.","id":"n209","text":"export function fakeAgents(work) {\n  const pieces = readJson(path.join(work, \"pieces.json\")), groups = readJson(path.join(work, \"groups.json\"));\n  const words = s => s.replace(/[^A-Za-z0-9]+/g, \" \").trim().split(/\\s+/).slice(0, 2).map(w => w[0].toUpperCase() + w.slice(1)).join(\" \");\n  for (const g of groups) {\n    let sum = \"\";\n    for (const w of g.windows) {\n      const lines = [];\n      for (let i = w.from; i \u003c= w.to; i++) {\n        const p = pieces.pieces[i - 1], stem = words(path.basename(pieces.files[p.f].rel, path.extname(pieces.files[p.f].rel))) || \"Misc\";\n        const topic = stem.split(\" \").length \u003c 2 ? `${stem} Topic` : stem;\n        lines.push(`${i};Area ${g.g}/${topic}/Piece ${i}${p.k === \"c\" ? `;Does thing number ${i} for the system.` : \"\"}`);\n      }\n      fs.writeFileSync(path.join(work, \"out\", `g${g.g}-w${w.w}.txt`), lines.join(\"\\n\") + \"\\n\");\n      fs.writeFileSync(path.join(work, \"out\", `g${g.g}-w${w.w}.sum`), `Group ${g.g} window ${w.w} summary.\\n`);\n    }\n  }\n  fs.writeFileSync(path.join(work, \"merge.txt\"), groups.map(g => `${g.g};Area ${g.g};Area ${g.g}`).join(\"\\n\") + \"\\n\");\n}"},{"title":"Simulate Description Agents","file":"test/helpers.mjs","start":56,"end":63,"kind":"code","lang":"js","description":"Writes a description file per group covering every branch path in the tree, each described by a generic sentence built from its path.","id":"n210","text":"export function fakeDescriptions(work, groups) {\n  const rows = fs.readFileSync(path.join(work, \"tree.paths\"), \"utf8\").split(\"\\n\").filter(Boolean).map(l => l.split(\";\"));\n  for (const g of groups) {\n    const need = new Set();\n    for (const [gg, p] of rows) if (+gg === g.g) { const s = p.split(\"/\"); for (let d = 1; d \u003c s.length && d \u003c= 3; d++) need.add(s.slice(0, d).join(\"/\")); }\n    fs.writeFileSync(path.join(work, \"desc\", `g${g.g}.txt`), [...need].map(p => `${p};Describes ${p.split(\"/\").at(-1)}.`).join(\"\\n\") + \"\\n\");\n  }\n}"}],"description":"Simulated outline and description agents that stand in for real model calls during tests.","id":"n208"}],"description":"Shared test infrastructure: support helpers, fixture projects and fake agents used across the test suite.","id":"n200"}],"description":"Workflow orchestration and the test harness that exercises it, covering phases, fixtures and simulated agents.","id":"n193"}],"id":"n0"}}</script>
<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const HUES=[225,160,32,285,355,190,78,325];
const wc=s=>s.trim().split(/\s+/).filter(Boolean).length;
const LAZY=40, MAXMATCH=400;
let T,S,byId,sel,viewRoot,key,filter="",nLeaves=0,srcText="";

/* ---------- tiny markdown renderer (no dependencies) ---------- */
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function inline(s){
  const codes=[];s=s.replace(/`([^`]+)`/g,(_,c)=>{codes.push(c);return "\u0000"+(codes.length-1)+"\u0000"});
  s=esc(s);
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(_,t,u)=>`<a href="${u.replace(/"/g,"%22")}" target="_blank" rel="noopener">${t}</a>`);
  s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*\w])\*([^*\s][^*]*)\*(?!\*)/g,"$1<i>$2</i>").replace(/(^|[^\w])_([^_\s][^_]*)_(?!\w)/g,"$1<i>$2</i>");
  return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>"<code>"+esc(codes[i])+"</code>");
}
const cells=r=>r.trim().replace(/^\||\|$/g,"").split(/(?<!\\)\|/).map(c=>c.trim().replace(/\\\|/g,"|"));
function table(rows){
  const sep=rows[1]&&/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(rows[1]);
  let h="<div class=\"tblw\"><table>";
  if(sep){h+="<thead><tr>"+cells(rows[0]).map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead>";rows=rows.slice(2)}
  h+="<tbody>"+rows.map(r=>"<tr>"+cells(r).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>";
  return h;
}
const LI=/^(\s*)([-*+]|\d+[.)])\s+(.*)/;
function list(lines){
  const items=[];
  for(const ln of lines){const m=ln.match(LI);if(m)items.push({ind:m[1].replace(/\t/g,"  ").length,ord:/\d/.test(m[2]),t:m[3]});else if(ln.trim()&&items.length)items.at(-1).t+=" "+ln.trim()}
  let h="";const st=[];
  for(const it of items){
    while(st.length&&it.ind<st.at(-1).ind)h+="</li></"+st.pop().tag+">";
    if(!st.length||it.ind>st.at(-1).ind){const tag=it.ord?"ol":"ul";h+="<"+tag+"><li>"+inline(it.t);st.push({ind:it.ind,tag})}
    else h+="</li><li>"+inline(it.t);
  }
  while(st.length)h+="</li></"+st.pop().tag+">";
  return h;
}
function md(src){
  const L=src.split("\n"),out=[];let i=0;
  const startsBlock=l=>/^\s*(```|~~~)/.test(l)||/^\s*\|/.test(l)||/^\s*#{1,6}\s/.test(l)||LI.test(l)||/^\s*>/.test(l);
  while(i<L.length){
    const l=L[i];let m;
    if(!l.trim()){i++;continue}
    if((m=l.match(/^\s*(```+|~~~+)/))){const f=m[1].slice(0,3),b=[];let j=i+1;while(j<L.length&&!L[j].trim().startsWith(f)){b.push(L[j]);j++}out.push("<pre><code>"+esc(b.join("\n"))+"</code></pre>");i=j+1;continue}
    if(/^\s*\|/.test(l)){const rows=[];while(i<L.length&&/^\s*\|/.test(L[i]))rows.push(L[i++]);out.push(table(rows));continue}
    if((m=l.match(/^\s*#{1,6}\s+(.*)/))){out.push("<h4>"+inline(m[1])+"</h4>");i++;continue}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){out.push("<hr>");i++;continue}
    if(/^\s*>/.test(l)){const b=[];while(i<L.length&&/^\s*>/.test(L[i]))b.push(L[i++].replace(/^\s*>\s?/,""));out.push("<blockquote>"+md(b.join("\n"))+"</blockquote>");continue}
    if(LI.test(l)){const b=[];
      while(i<L.length){const x=L[i];
        if(LI.test(x)||(x.trim()&&/^\s/.test(x))){b.push(x);i++}
        else if(!x.trim()&&i+1<L.length&&(LI.test(L[i+1])||/^\s+\S/.test(L[i+1]))){i++}
        else break}
      out.push(list(b));continue}
    const b=[];while(i<L.length&&L[i].trim()&&!(b.length&&startsBlock(L[i])))b.push(L[i++].trim());
    out.push("<p>"+inline(b.join(" "))+"</p>");
  }
  return out.join("");
}

/* ---------- model ---------- */
function load(tree){
  T=tree;byId={};nLeaves=0;
  (function w(n,p,d,top){n.parent=p;n.d=d;n.top=top;byId[n.id]=n;
    if(n.children)n.children.forEach((c,i)=>w(c,n,d+1,d===0?i:n.top));else{n.orig=n.text;n.odesc=n.description||"";n._w=wc(n.kind==="code"?n.odesc:n.text);nLeaves++}})(T.tree,null,0,0);
  key="whitebox:"+(T.title||"")+":"+nLeaves+":"+T.tree.children.length;
  S={inc:{},text:{},desc:{},collapsed:null,sel:T.tree.id};
  try{const s=JSON.parse(localStorage.getItem(key)||"null");if(s)S={...S,...s}}catch(_){}
  if(!S.collapsed){S.collapsed={};if(nLeaves>600)Object.values(byId).forEach(n=>{if(n.children&&n.d>=1)S.collapsed[n.id]=true})}
  S.desc=S.desc||{};Object.values(byId).forEach(n=>{if(n.children)return;if(n.kind==="code"){if(S.desc[n.id]!=null){n.description=S.desc[n.id];n._w=wc(n.description)}}else if(S.text[n.id]!=null){n.text=S.text[n.id];n._w=wc(n.text)}});
  sel=byId[S.sel]||T.tree;
  $("#ttl").textContent=T.title||T.tree.title;document.title=(T.title||T.tree.title)+" · Whitebox";
  const o=$("#outline");o.textContent="";o.append(rowWrap(T.tree));

}
const save=()=>{S.sel=sel.id;try{localStorage.setItem(key,JSON.stringify(S))}catch(_){}};
const leaves=n=>n.children?(n._l??=n.children.flatMap(leaves)):[n];
const on=l=>S.inc[l.id]!==false;
const isEdited=n=>n.kind==="code"?(n.description||"")!==n.odesc:n.text!==n.orig;
const hue=n=>HUES[n.top%HUES.length];
const path=n=>{const a=[];for(let p=n;p;p=p.parent)a.unshift(p);return a};
function computeStats(n){
  if(!n.children){const o=on(n);return n._s={n:1,k:o?1:0,w:o?n._w:0,tw:n._w,e:isEdited(n)?1:0}}
  const s={n:0,k:0,w:0,tw:0,e:0};
  for(const c of n.children){const t=computeStats(c);s.n+=t.n;s.k+=t.k;s.w+=t.w;s.tw+=t.tw;s.e+=t.e}
  return n._s=s;
}
const stat=n=>n._s;

/* ---------- outline (lazy) ---------- */

function buildKids(n,k){k=k||$(`[data-kids="${n.id}"]`);if(!k||n._built)return;n._built=true;n.children.forEach(c=>k.append(rowWrap(c)))}

  const t=$(`.row[data-id="${n.id}"] .tw`);if(t)t.textContent=c?"▶":"▼";save();refresh(true);
}

$("#expand").onclick=()=>{Object.values(byId).forEach(n=>{if(n.children&&(nLeaves<=600||n.d<2))delete S.collapsed[n.id]});save();const o=$("#outline");o.textContent="";Object.values(byId).forEach(n=>n._built=false);o.append(rowWrap(T.tree));refresh(true)};
$("#collapse").onclick=()=>{Object.values(byId).forEach(n=>{if(n.children&&n.d>=1)S.collapsed[n.id]=true});save();const o=$("#outline");o.textContent="";Object.values(byId).forEach(n=>n._built=false);o.append(rowWrap(T.tree));refresh(true)};

/* ---------- main document ---------- */
function select(n,scroll){

    if(i===a.length-1)cr.append(el("b",null,p.title));else{const l=el("a",null,p.title);l.onclick=()=>select(p,true);cr.append(l)}});

    seg.onclick=()=>{if(c.children){const x=$(`section[data-id="${c.id}"]`);if(x){x.scrollIntoView({block:"start"});const b=x.querySelector(":scope>.sbody>.more");if(b)b.click()}else select(c,true)}else select(c,true)};map.append(seg)});

}
function section(n,isRoot,forceOpen){

    n.children.forEach(c=>{if(c.children){grid=null;body.append(section(c,false,forceOpen))}else{if(!grid){grid=el("div","grid");body.append(grid)}grid.append(card(c))}});
    if(!initial){requestAnimationFrame(growAll);refresh(true)}};

function card(n){
  const code=n.kind==="code";
  const c=el("div","card"+(code?" codecard":""));c.dataset.id=n.id;c.style.setProperty("--h",hue(n));

  cf.append(el("span",null,n.file+":"+n.start+(n.end>n.start?"–"+n.end:"")),el("span","tag",code?"● intent changed":"● edited"),rv);

/* ---------- refresh ---------- */
function refresh(typing){
  computeStats(T.tree);
  $$(".row").forEach(r=>{const n=byId[r.dataset.id],cb=r.querySelector("input"),mt=r.querySelector(".mt"),ed=r.querySelector(".ed"),st=stat(n);
    r.classList.toggle("sel",n===sel);
    if(n.children){cb.checked=st.k===st.n;cb.indeterminate=st.k>0&&st.k<st.n;r.classList.toggle("off",st.k===0);mt.textContent=st.k===st.n?st.n:st.k+"/"+st.n;ed.classList.toggle("gone",!st.e)}
    else{cb.checked=on(n);r.classList.toggle("off",!on(n));ed.classList.toggle("gone",!st.e)}});
  $$(".card").forEach(c=>{const n=byId[c.dataset.id],o=on(n);c.classList.toggle("off",!o);c.classList.toggle("edited",isEdited(n));
    const p=c.querySelector(".pill");p.textContent=o?"✓ In":"Out";p.classList.toggle("on",o);p.title=o?"Click to exclude":"Click to include"});
  $$("section.sec").forEach(s=>{const n=byId[s.dataset.id],st=stat(n);
    s.querySelector(":scope>.shd .sm").textContent=`${st.k}/${st.n} pieces · ${st.w} words`;
    const p=s.querySelector(":scope>.shd .pill");const all=st.k===st.n;p.textContent=all?"✓ All in":st.k?"Mixed":"All out";p.classList.toggle("on",all)});
  $$(".seg[data-id]").forEach(g=>{const st=stat(byId[g.dataset.id]);g.classList.toggle("off",st.k===0);g.querySelector(".sc").textContent=`${st.k}/${st.n} · ${st.w}w`});
  const all=stat(T.tree);$("#budget").innerHTML=`<b>${all.k}</b>/${all.n} pieces · <b>${all.w}</b> words · ≈${Math.round(all.w*1.35)} tokens`;
  const nc=all.e+(all.n-all.k);$("#chgN").textContent=nc;$("#chgN").classList.toggle("gone",!nc);
  applyFilter();

/* ---------- filter ---------- */
let vis=null;
const lc=n=>n._lc??=(n.title+" "+(n.description||"")+" "+n.text).toLowerCase();
function matches(){
  const q=filter,ids=new Set();
  if(!q)return null;
  const hit=[];
  leaves(T.tree).forEach(l=>{if(lc(l).includes(q))hit.push(l)});
  Object.values(byId).forEach(n=>{if(n.children&&n.title.toLowerCase().includes(q))hit.push(...leaves(n))});
  hit.forEach(l=>{ids.add(l.id);for(let p=l.parent;p;p=p.parent)ids.add(p.id)});
  return {ids,leaves:[...new Set(hit)]};
}
const canOpenAll=()=>{const m=matches();return m&&m.leaves.length<=MAXMATCH};
function applyFilter(){
  const m=matches();vis=m?m.ids:null;
  $$(".row").forEach(r=>r.classList.toggle("flt",!!vis&&!vis.has(r.dataset.id)));
  $$(".card").forEach(c=>c.classList.toggle("flt",!!vis&&!vis.has(c.dataset.id)));
  $$("section.sec").forEach(s=>s.classList.toggle("flt",!!vis&&!vis.has(s.dataset.id)));
  let note=$("#fnote");if(!note){note=el("div");note.id="fnote";note.className="muted";$("#crumbs").after(note)}
  note.textContent=m?`${m.leaves.length} matching pieces${m.leaves.length>MAXMATCH?" — narrow the filter to expand them all":""}`:"";
}
let ft=null;
$("#q").oninput=e=>{clearTimeout(ft);ft=setTimeout(()=>{filter=e.target.value.trim().toLowerCase();
  const m=matches();
  if(m&&m.leaves.length<=MAXMATCH){m.leaves.forEach(l=>reveal(l));drawDoc(viewRoot,true)}else drawDoc(viewRoot,false);
  refresh(true)},160)};

/* ---------- changes drawer ---------- */
function collect(){
  const edits=[],excluded=[];
  const intents=[];
  leaves(T.tree).forEach(n=>{const o=on(n),e=isEdited(n);if(o&&!e)return;const p=path(n).slice(1).map(x=>x.title).join(" > ");
    if(!o)excluded.push({file:n.file,start:n.start,end:n.end,before:n.orig,path:p,...(n.kind==="code"?{kind:"code"}:{})});
    else if(n.kind==="code")intents.push({file:n.file,start:n.start,end:n.end,path:p,before:n.odesc,after:n.description||""});
    else edits.push({file:n.file,start:n.start,end:n.end,before:n.orig,after:n.text,path:p})});

}
function drawChanges(){

    p.onclick=()=>{const n=leaves(T.tree).find(l=>l.file===e.file&&l.start===e.start);if(n)select(n,true)};
    c.append(p,el("pre","del",e.before.split("\n").map(l=>"− "+l).join("\n")),el("pre","add",e.after.split("\n").map(l=>"+ "+l).join("\n")));b.append(c)});

      p.onclick=()=>{const n=leaves(T.tree).find(l=>l.file===e.file&&l.start===e.start);if(n)select(n,true)};

}

function dl(name,txt,type){const a=el("a");a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
/* Inside a Claude artifact the page cannot start downloads itself and `window.claude` exists: use the `downloads` and `db` capabilities when
   they resolve, and fall back to a plain link (standalone file) or hide the control. */
const cap=async n=>{try{return window.claude&&window.claude.use?await window.claude.use(n):null}catch(_){return null}};
const say=t=>{const m=$("#sendmsg");if(m)m.textContent=t||""};
async function saveFile(name,txt,type){
  const d=await cap("downloads");
  if(d){try{await d.save({filename:name,data:txt});say("");return}catch(e){say(e&&e.code==="declined"?"Not saved.":"Saving is not available here.");if(!e||e.code==="declined")return}}

const editsJson=()=>{const c=collect();return JSON.stringify({version:1,root:T.root||".",edits:c.edits,excluded:c.excluded,intents:c.intents},null,2)};
async function sendEdits(){
  const c=collect();if(!c.edits.length&&!c.excluded.length&&!c.intents.length){say("Nothing to send yet: edit or exclude a piece first.");return}
  const db=await cap("db");if(!db){say("Sending to Claude is not available here. Use Download edits.");return}
  const json=editsJson(),CH=60000,parts=[];
  for(let i=0;i<json.length;){let j=Math.min(json.length,i+CH);const cc=json.charCodeAt(j);if(j<json.length&&cc>=0xDC00&&cc<=0xDFFF)j++;parts.push(json.slice(i,j));i=j}
  try{
    for(let i=0;i<parts.length;i++)await db.doc("whitebox-edits/c"+String(i).padStart(4,"0")).set({i,of:parts.length,part:parts[i]});
    await db.doc("whitebox-edits/meta").set({n:parts.length,chars:json.length,edits:c.edits.length,excluded:c.excluded.length,intents:c.intents.length,sentAt:new Date().toISOString()});
    say(`Sent ${c.edits.length} edit(s), ${c.excluded.length} exclusion(s) and ${c.intents.length} behaviour note(s). Tell Claude: "apply my whitebox edits".`);
  }catch(e){say("Could not send: "+((e&&e.message)||"unknown error")+". Use Download edits.")}
}

(function(){

  rz.addEventListener("pointerdown",e=>{rz.setPointerCapture(e.pointerId);rz.classList.add("drag");
    const mv=ev=>{const x=Math.max(200,Math.min(innerWidth*.75,ev.clientX));side.style.setProperty("--sw",x+"px");w=x};
    const up=()=>{rz.classList.remove("drag");rz.removeEventListener("pointermove",mv);rz.removeEventListener("pointerup",up);try{localStorage.setItem("whitebox:sw",String(Math.round(w)))}catch(_){}requestAnimationFrame(growAll)};
    rz.addEventListener("pointermove",mv);rz.addEventListener("pointerup",up)});
  rz.addEventListener("dblclick",()=>{side.style.removeProperty("--sw");w=null;try{localStorage.removeItem("whitebox:sw")}catch(_){}});
})();

srcText=document.getElementById("tree-src").textContent;
load(JSON.parse(srcText));
</script>
</body>
